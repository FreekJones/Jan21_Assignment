<%inherit file="base.html" />
<head>
    <link rel="stylesheet" type="text/css" href="/html/style.css">
    <style>
        .error-message {
            color: red !important; 
            font-size: 0.9em;
            margin-top: 5px;
            font-weight: bold;
        }
        .welcome-banner {
            color: blue !important; 
            font-weight: bold;
            text-align: center;
            padding: 10px;
            margin-top: 10px;
            display: none;
            font-size: 1.2em;
        }
    </style>
</head>
<%block name="body">
    <div class="signup-popup">
        <h2>Signup to be Freek Jones' Friend</h2>
        <form id="signupForm" onsubmit="return validateSignup(event)" novalidate>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">
            <div id="emailError" class="error-message"></div>

            <label for="real-name">Real Name</label>
            <input type="text" id="realName" name="realName" placeholder="Enter your real name">
            <div id="realNameError" class="error-message"></div>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password">
            <div id="passwordError" class="error-message"></div>

            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob">
            <div id="dobError" class="error-message"></div>

            <button type="submit">Sign Up</button>
        </form>
        <div id="welcomeBanner" class="welcome-banner">Welcome!</div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document.getElementById('welcomeBanner').style.display = 'none'; 
        });

        function validateSignup(event) {
            event.preventDefault(); 

            const email = document.getElementById('email').value.trim();
            const realName = document.getElementById('realName').value.trim();
            const password = document.getElementById('password').value.trim();
            const dob = document.getElementById('dob').value.trim();
            const welcomeBanner = document.getElementById('welcomeBanner');

            document.querySelectorAll('.error-message').forEach(el => el.textContent = '');
            welcomeBanner.style.display = 'none';

            let hasError = false;

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email) {
                document.getElementById('emailError').textContent = "Email is required.";
                hasError = true;
            } else if (!emailRegex.test(email)) {
                document.getElementById('emailError').textContent = "Please enter a valid email address.";
                hasError = true;
            }

            if (!realName) {
                document.getElementById('realNameError').textContent = "Real name is required.";
                hasError = true;
            }

            if (!password) {
                document.getElementById('passwordError').textContent = "Password is required.";
                hasError = true;
            }

            if (!dob) {
                document.getElementById('dobError').textContent = "Date of birth is required.";
                hasError = true;
            } else {
                const today = Date.now();
                const birthDate = new Date(dob).getTime();
                const ageInMilliseconds = today - birthDate;
                const ageInYears = ageInMilliseconds / (1000 * 60 * 60 * 24 * 365.25);

                if (ageInYears < 13) {
                    document.getElementById('dobError').textContent = "You must be at least 13 years old to sign up.";
                    hasError = true;
                }
            }

            if (hasError) return false;

            welcomeBanner.style.display = 'block';

            return false; 
        }
    </script>
</%block>
